<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2C4B"/>
      <stop offset="1" stop-color="#06182B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B477"/>
      <stop offset="1" stop-color="#9C7A46"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <!-- subtle dot grid for texture -->
  <g opacity="0.06" fill="#FFFFFF">
    <g>
    </g>
  </g>
  <g transform="translate(512,420)">
    <!-- Shield -->
    <g transform="translate(-118,-180)">
      <path d="M0,0 L236,0 L236,156 C236,242 181,286 118,312 C55,286 0,242 0,156 Z"
            fill="none" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
      <path d="M54,48 L118,224 L182,48"
            fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M54,48 L118,224 L182,48"
            fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <!-- Wordmark below V shield -->
    <g transform="translate(-270,190)" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="270" y="0" font-size="96" letter-spacing="1">Vanguard<tspan fill="url(#gold)">Trust</tspan></text>
      <line x1="60" y1="34" x2="480" y2="34" stroke="#FFFFFF" stroke-width="2" opacity="0.18"/>
      <text x="270" y="80" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="22" letter-spacing="6" fill="#FFFFFF" opacity="0.78">WEALTH    TRUST    STEWARDSHIP</text>
    </g>
    <!-- Progress ring -->
    <circle cx="0" cy="130" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
    <circle cx="0" cy="130" r="132" fill="none" stroke="url(#gold)" stroke-width="5"
            stroke-dasharray="280 550" stroke-linecap="round" transform="rotate(-90 0 130)"/>
  </g>
</svg>
