<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=/index.php.html" />
    <link rel="icon" href="assets/images/brand/favicon_VanguardDoubleTrust.svg" type="image/svg+xml" />
    <title>VanguardDoubleTrust</title>
    <style>
      :root {
        color-scheme: dark;
        --vt-bg: #0a0f1a;
        --vt-bg-2: #10172a;
        --vt-bg-3: #121a2d;
        --vt-panel: #10172a;
        --vt-card: #121a2d;
        --vt-fg: #ffffff;
        --vt-fg-2: #cdd5e3;
        --vt-muted: #8a95ac;
        --vt-line: rgba(255,255,255,0.08);
        --vt-border: rgba(255,255,255,0.10);
        --vt-accent: #e8c367;
        --vt-accent-2: #ffffff;
        --vt-primary: #e8c367;
        --vt-white: #ffffff;
        --vt-black: #000000;
        --vt-input-bg: #000000;
        --vt-input-fg: #ffffff;
        --vt-ok: #6ee7a7;
        --vt-danger: #ffffff;
        --vt-warn: #e8c367;
      }
      button, .btn, [class*="button"], [role="button"],
      input[type="submit"], input[type="button"],
      a.btn, a[class*="-btn"] {
        --bg-btn: var(--vt-primary) !important;
        background: var(--vt-primary) !important;
        background-color: var(--vt-primary) !important;
        color: #0a0f1a !important;
        border-color: var(--vt-primary) !important;
      }
      button.btn-secondary, .btn-secondary, .btn-outline, .btn-outline-primary,
      button.outline, .button.secondary, [class*="outline"] {
        background: transparent !important;
        background-color: transparent !important;
        color: var(--vt-primary) !important;
        border-color: var(--vt-primary) !important;
      }
      body { background: var(--vt-bg); color: var(--vt-fg); }
    </style>
  </head>
  <body></body>
</html>
