<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VanguardTrust Admin Login</title>
    <link rel="icon" href="/assets/images/brand/favicon_vanguardtrust.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b10;
        --bg-2: #0b0f14;
        --panel: rgba(15, 23, 42, 0.82);
        --line: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --muted: #94a3b8;
        --gold: #d4af37;
        --gold-2: #f5d87a;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background:
          radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 30%),
          linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(100%, 430px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
      }

      .logo {
        width: 180px;
        display: block;
        margin: 0 auto 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        text-align: center;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        text-align: center;
      }

      label {
        display: block;
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 700;
        color: #dbe4f0;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        margin: 0 0 18px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: rgba(212, 175, 55, 0.7);
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
      }

      button {
        width: 100%;
        padding: 15px 18px;
        border: 0;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 800;
        color: #0b0f14;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
      }

      .error {
        min-height: 20px;
        margin-top: 14px;
        text-align: center;
        color: #fecaca;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/assets/images/brand/logo_vanguardtrust.svg" alt="VanguardTrust" />
      <h1>Admin Access</h1>
      <p>Sign in to manage customer accounts and dashboard balances.</p>
      <form id="adminLoginForm">
        <label for="adminEmail">Admin Email</label>
        <input id="adminEmail" name="email" type="email" autocomplete="username" required />

        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />

        <button type="submit" id="adminLoginBtn">Open Dashboard</button>
        <div class="error" id="adminLoginError"></div>
      </form>
    </main>
    <script src="/admin/assets/js/admin-session.js"></script>
  </body>
</html>
