<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VanguardDoubleTrust Admin Login</title>
    <link rel="icon" href="/assets/images/brand/favicon_VanguardDoubleTrust.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f1a;
        --bg-2: #10172a;
        --bg-3: #121a2d;
        --panel: #10172a;
        --panel-2: #121a2d;
        --panel-3: #162038;
        --fg: #ffffff;
        --fg-2: #cdd5e3;
        --muted: #8a95ac;
        --line: rgba(255,255,255,0.08);
        --accent: #e8c367;
        --accent-2: #ffffff;
        --accent-3: #0a0f1a;
        --warn: #e8c367;
        --error: #ffffff;
        --ok: #6ee7a7;
        --primary-color: #e8c367;
        --secondary-color: #10172a;
        --dark-bg-color: #0a0f1a;
        --light-color: #ffffff;
        --white-color: #ffffff;
        --dark-color: #0a0f1a;
        --light-bg: #10172a;
        --gray-bg: #121a2d;
        --text-dark: #ffffff;
        --text-light: #0a0f1a;
        --border-color: rgba(255,255,255,0.10);
        --vt-primary: #e8c367;
        --vt-primary-2: #ffffff;
        --vt-bg: #0a0f1a;
        --vt-card-bg: #10172a;
        --vt-card-2: #121a2d;
        --vt-text: #ffffff;
        --vt-text-2: #cdd5e3;
        --vt-muted: #8a95ac;
        --vt-border: rgba(255,255,255,0.10);
        --vt-success: #6ee7a7;
        --vt-danger: #ffffff;
        --vt-warn: #e8c367;
        --vt-info: #ffffff;
        --vt-accent: #e8c367;
        --vt-avatar-bg: #121a2d;
      }
      button, .btn, [class*="button"], [role="button"],
      input[type="submit"], input[type="button"],
      a.btn, a[class*="-btn"] {
        --bg-btn: var(--primary-color) !important;
        background: var(--primary-color) !important;
        background-color: var(--primary-color) !important;
        color: #0a0f1a !important;
        border-color: var(--primary-color) !important;
      }
      button.btn-secondary, .btn-secondary, .btn-outline, .btn-outline-primary,
      button.outline, .button.secondary, [class*="outline"] {
        background: transparent !important;
        background-color: transparent !important;
        color: var(--primary-color) !important;
        border-color: var(--primary-color) !important;
      }
      * { border-color: rgba(255,255,255,0.10) !important; }
      html, body { background: var(--bg); color: var(--fg); }
      :root {
        color-scheme: dark;
        --bg: #1e3a8a;
        --bg-2: #1d4ed8;
        --panel: rgba(30, 58, 138, 0.82);
        --line: rgba(219, 234, 254, 0.2);
        --text: #f8fafc;
        --muted: #93c5fd;
        --gold: #165DFF;
        --gold-2: #3b82f6;
        --danger: #2563eb;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background:
          radial-gradient(circle at top, rgba(22, 93, 255, 0.14), transparent 30%),
          linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(100%, 430px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
      }

      .logo {
        width: 180px;
        display: block;
        margin: 0 auto 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        text-align: center;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        text-align: center;
      }

      label {
        display: block;
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 700;
        color: #bfdbfe;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        margin: 0 0 18px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(219, 234, 254, 0.05);
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: rgba(22, 93, 255, 0.7);
        box-shadow: 0 0 0 4px rgba(22, 93, 255, 0.12);
      }

      button {
        width: 100%;
        padding: 15px 18px;
        border: 0;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 800;
        color: #ffffff;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
      }

      .error {
        min-height: 20px;
        margin-top: 14px;
        text-align: center;
        color: #bfdbfe;
        font-size: 13px;
      }

      @media (max-width: 520px) {
        body {
          padding: 14px;
        }

        .card {
          padding: 22px 18px;
          border-radius: 18px;
        }

        .logo {
          width: 150px;
          margin-bottom: 14px;
        }

        h1 {
          font-size: 22px;
        }

        p {
          margin-bottom: 22px;
          font-size: 13px;
        }

        input {
          padding: 12px 14px;
          border-radius: 12px;
          margin-bottom: 14px;
        }

        button {
          padding: 13px 16px;
          border-radius: 12px;
        }
      }

    /* ===== FINAL ADMIN PALETTE CORRECTION ===== */
    :root {
        color-scheme: dark;
        --bg: #0a0f1a !important;
        --bg-2: #10172a !important;
        --panel: rgba(16, 23, 42, 0.9) !important;
        --line: rgba(255,255,255,0.10) !important;
        --text: #ffffff !important;
        --muted: #8a95ac !important;
        --gold: #e8c367 !important;
        --gold-2: #d4b258 !important;
        --danger: #ffffff !important;
        --ok: #6ee7a7 !important;
        --primary-color: #e8c367 !important;
        --vt-primary: #e8c367 !important;
    }
    button, .btn, [class*="button"], [role="button"],
    input[type="submit"], input[type="button"] {
        background: #e8c367 !important;
        background-color: #e8c367 !important;
        color: #0a0f1a !important;
        border-color: #e8c367 !important;
        background-image: none !important;
    }
    button.btn-secondary, .btn-secondary, .btn-outline {
        background: transparent !important;
        background-color: transparent !important;
        color: #e8c367 !important;
        border-color: #e8c367 !important;
        background-image: none !important;
    }
    button:hover, .btn:hover {
        background-color: #d4b258 !important;
        border-color: #d4b258 !important;
    }
    body {
        background:
          radial-gradient(circle at top, rgba(232, 195, 103, 0.10), transparent 30%),
          linear-gradient(135deg, #0a0f1a 0%, #10172a 100%) !important;
    }
    /* ===== BRIGHT READABLE BUTTONS (LOGOUT / PROCEED / DANGER / ACTION) ===== */
    .tf-btn, #submitTransfer, [id*="proceed"], [class*="proceed"], [class*="confirmBtn"],
    button.confirm, swal2-confirm, .swal2-confirm, .btn-primary,
    button[onclick*="proceed"], button[onclick*="submit"] {
        background: #2563eb !important;
        background-color: #2563eb !important;
        background-image: none !important;
        color: #ffffff !important;
        border-color: #2563eb !important;
        font-weight: 800 !important;
    }
    .tf-btn:hover, #submitTransfer:hover, [id*="proceed"]:hover, [class*="confirmBtn"]:hover,
    .swal2-confirm:hover, .btn-primary:hover {
        background-color: #1d4ed8 !important;
        border-color: #1d4ed8 !important;
        color: #ffffff !important;
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35) !important;
    }
    .btn-logout, #logoutBtn, #logoutBtn2, #quickLogoutBtn, #adminLogoutBtn,
    #pinVerifyLogout, [id*="Logout"], [class*="logout"], [class*="Logout"],
    .btn-danger, .btn.btn-dark, button.btn-dark, [class*="cancelBtn"],
    .swal2-cancel, button.cancel, [class*="cancel"] {
        background: #dc2626 !important;
        background-color: #dc2626 !important;
        background-image: none !important;
        color: #ffffff !important;
        border-color: #dc2626 !important;
        font-weight: 800 !important;
    }
    .btn-logout:hover, #logoutBtn:hover, #logoutBtn2:hover,
    #quickLogoutBtn:hover, #adminLogoutBtn:hover, #pinVerifyLogout:hover,
    .btn-danger:hover, .btn.btn-dark:hover, .swal2-cancel:hover {
        background-color: #b91c1c !important;
        border-color: #b91c1c !important;
        color: #ffffff !important;
        box-shadow: 0 6px 20px rgba(220, 38, 38, 0.35) !important;
    }
    .vt-action {
        background: #ffffff !important;
        background-color: #ffffff !important;
        color: #0a0f1a !important;
        border-color: rgba(255,255,255,0.30) !important;
        font-weight: 800 !important;
    }
    .vt-action i {
        color: #2563eb !important;
    }
    .vt-action:hover {
        background: #f8fafc !important;
        color: #0a0f1a !important;
        box-shadow: 0 14px 32px -20px rgba(0,0,0,0.5) !important;
    }
    * { border-color: rgba(255,255,255,0.10) !important; }
    html, body { background-color: #0a0f1a !important; color: #ffffff !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/assets/images/brand/logo_VanguardDoubleTrust.svg" alt="VanguardDoubleTrust" />
      <h1>Admin Access</h1>
      <p>Sign in to manage customer accounts and dashboard balances.</p>
      <form id="adminLoginForm">
        <label for="adminEmail">Admin Email</label>
        <input id="adminEmail" name="email" type="email" autocomplete="username" required />

        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />

        <button type="submit" id="adminLoginBtn">Open Dashboard</button>
        <div class="error" id="adminLoginError"></div>
      </form>
    </main>
    <script src="/admin/assets/js/admin-session.js"></script>
  </body>
</html>
