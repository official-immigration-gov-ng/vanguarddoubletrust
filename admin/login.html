<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VanguardDoubleTrust Admin Login</title>
    <link rel="icon" href="/assets/images/brand/favicon_VanguardDoubleTrust.svg" type="image/svg+xml" />
    <style>
      html { filter: grayscale(1) !important; -webkit-filter: grayscale(1) !important; }
      :root {
        color-scheme: dark;
        --bg: #1e3a8a;
        --bg-2: #1d4ed8;
        --panel: rgba(30, 58, 138, 0.82);
        --line: rgba(219, 234, 254, 0.2);
        --text: #f8fafc;
        --muted: #93c5fd;
        --gold: #165DFF;
        --gold-2: #3b82f6;
        --danger: #2563eb;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background:
          radial-gradient(circle at top, rgba(22, 93, 255, 0.14), transparent 30%),
          linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(100%, 430px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
      }

      .logo {
        width: 180px;
        display: block;
        margin: 0 auto 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        text-align: center;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        text-align: center;
      }

      label {
        display: block;
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 700;
        color: #bfdbfe;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        margin: 0 0 18px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(219, 234, 254, 0.05);
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: rgba(22, 93, 255, 0.7);
        box-shadow: 0 0 0 4px rgba(22, 93, 255, 0.12);
      }

      button {
        width: 100%;
        padding: 15px 18px;
        border: 0;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 800;
        color: #ffffff;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
      }

      .error {
        min-height: 20px;
        margin-top: 14px;
        text-align: center;
        color: #bfdbfe;
        font-size: 13px;
      }

      @media (max-width: 520px) {
        body {
          padding: 14px;
        }

        .card {
          padding: 22px 18px;
          border-radius: 18px;
        }

        .logo {
          width: 150px;
          margin-bottom: 14px;
        }

        h1 {
          font-size: 22px;
        }

        p {
          margin-bottom: 22px;
          font-size: 13px;
        }

        input {
          padding: 12px 14px;
          border-radius: 12px;
          margin-bottom: 14px;
        }

        button {
          padding: 13px 16px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/assets/images/brand/logo_VanguardDoubleTrust.svg" alt="VanguardDoubleTrust" />
      <h1>Admin Access</h1>
      <p>Sign in to manage customer accounts and dashboard balances.</p>
      <form id="adminLoginForm">
        <label for="adminEmail">Admin Email</label>
        <input id="adminEmail" name="email" type="email" autocomplete="username" required />

        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />

        <button type="submit" id="adminLoginBtn">Open Dashboard</button>
        <div class="error" id="adminLoginError"></div>
      </form>
    </main>
    <script src="/admin/assets/js/admin-session.js"></script>
  </body>
</html>
